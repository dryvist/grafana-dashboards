---
name: Validate Dashboards

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: scripts/validate_dashboards.sh
      - name: Install alert validation dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install pytest==9.0.3 yq==3.4.3
      - name: Validate alert provisioning
        env:
          YQ: .venv/bin/yq
        run: .venv/bin/python -m pytest -q provisioning/alerting/tests
