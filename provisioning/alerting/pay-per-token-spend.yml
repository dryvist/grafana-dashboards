---
# Grafana unified alerting; alert only, with no spending cap.
# MetricsQL @ selects the counter at UTC month start. Requires the supplied
# reset-free counter and a retained month-start sample; missing data is NoData.
apiVersion: 1
groups:
  - orgId: 1
    name: pay-per-token-spend
    folder: Alerting
    interval: 5m
    rules:
      - uid: pay-per-token-spend-warning
        title: OpenRouter month-to-date spend at least 50 cents
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 2678400
              to: 0
            datasourceUid: victoriametrics
            model:
              # Per series: month high minus its value at the UTC month
              # start (0 when born this month). Range functions, because
              # LiteLLM exports a spend series only while it is active.
              expr: >-
                sum(
                  clamp_min(max_over_time(
                    litellm_spend_metric_total{api_provider="openrouter"}[31d])
                  - (
                    max_over_time(
                      litellm_spend_metric_total{api_provider="openrouter"}[31d]
                      @ (time() - (scalar(day_of_month()) - 1) * 86400
                         - time() % 86400))
                    or max_over_time(
                      litellm_spend_metric_total{api_provider="openrouter"}[31d])
                    * 0), 0))
              instant: true
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: math
              expression: $A >= 0.50
              refId: B
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: math
              expression: $A * 100
              refId: C
        for: 0s
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
          ntfy: "true"
        annotations:
          summary: >-
            OpenRouter spend is {{ printf "%.2f" $values.C.Value }} cents
            this UTC month (50-cent warning).
          description: >-
            OpenRouter spend since UTC month start is
            {{ printf "%.2f" $values.C.Value }} cents.
            The threshold is 50 cents (0.50 USD); this alert applies no cap.
            Counter subtraction assumes no resets and a retained
            month-start sample.
            See /d/ai-cents-meter.
          __dashboardUid__: ai-cents-meter
          __panelId__: "4"
      - uid: pay-per-token-spend-critical
        title: OpenRouter month-to-date spend at least 100 cents
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 2678400
              to: 0
            datasourceUid: victoriametrics
            model:
              # Per series: month high minus its value at the UTC month
              # start (0 when born this month). Range functions, because
              # LiteLLM exports a spend series only while it is active.
              expr: >-
                sum(
                  clamp_min(max_over_time(
                    litellm_spend_metric_total{api_provider="openrouter"}[31d])
                  - (
                    max_over_time(
                      litellm_spend_metric_total{api_provider="openrouter"}[31d]
                      @ (time() - (scalar(day_of_month()) - 1) * 86400
                         - time() % 86400))
                    or max_over_time(
                      litellm_spend_metric_total{api_provider="openrouter"}[31d])
                    * 0), 0))
              instant: true
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: math
              expression: $A >= 1.00
              refId: B
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: math
              expression: $A * 100
              refId: C
        for: 0s
        noDataState: NoData
        execErrState: Error
        labels:
          severity: critical
          ntfy: "true"
        annotations:
          summary: >-
            OpenRouter spend is {{ printf "%.2f" $values.C.Value }} cents
            this UTC month (100-cent critical).
          description: >-
            OpenRouter spend since UTC month start is
            {{ printf "%.2f" $values.C.Value }} cents.
            The threshold is 100 cents (1.00 USD); this alert applies no cap.
            Counter subtraction assumes no resets and a retained
            month-start sample.
            See /d/ai-cents-meter.
          __dashboardUid__: ai-cents-meter
          __panelId__: "4"
      - uid: pay-per-token-spend-health-check
        title: Router health checks spend paid or subscription quota
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: victoriametrics
            model:
              # Local lanes are hosted_vllm plus the openai-provider models
              # in the ai-cents-meter local-model classifier (MLX and
              # llama.cpp lanes report api_provider="openai") and the
              # router's local GPU, CPU-pool and light lanes.
              expr: >-
                sum(
                  increase(litellm_input_tokens_metric_total{api_key_alias="litellm-internal-health-check", api_provider!~"hosted_vllm|openai"}[30m])
                  or
                  increase(litellm_input_tokens_metric_total{api_key_alias="litellm-internal-health-check", api_provider="openai", model!~"mlx-community/.*|nativ-community/.*|manjunathshiva/opendecider-nano|convaiinnovations/laya-typed-decisions|qwen3-4b|embeddings|bge-m3|bge-reranker-v2-m3|qwen3.5-9b-4080|qwen3.5-9b|qwen3.6-35b-a3b"}[30m])
                )
              instant: true
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: math
              expression: $A > 0
              refId: B
        for: 15m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
          ntfy: "true"
        annotations:
          summary: >-
            Router health checks sent {{ printf "%.0f" $values.A.Value }}
            input tokens to paid or subscription models in 30 minutes.
          description: >-
            The litellm-internal-health-check key sent
            {{ printf "%.0f" $values.A.Value }} input tokens in the last
            30 minutes to models outside the local lanes (hosted_vllm,
            the ai-cents-meter local-model classifier, and the router's
            local lanes).
            The threshold is above 0 tokens for 15 minutes.
            See /d/ai-cents-meter.
          __dashboardUid__: ai-cents-meter
          __panelId__: "4"
