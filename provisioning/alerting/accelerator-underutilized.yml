# Grafana file-provisioned model-serving alert rules (unified alerting).
# ansible-proxmox-apps copies this file into /var/lib/grafana/provisioning/alerting.
apiVersion: 1
groups:
  - orgId: 1
    name: accelerator-token-underuse
    folder: Alerting
    interval: 1m
    rules:
      - &critical-alert
        uid: accelerator-underutilized-gpu-primary
        title: Serving lane gpu-primary token utilization below 50% over 4 hours
        condition: B
        data:
          - &token-query
            refId: A
            relativeTimeRange:
              from: 14400
              to: 0
            datasourceUid: victoriametrics
            model:
              # Source: dryvist/prometheus-homelab-rules, rules/accelerator_tokens.yml (PR #11).
              expr: >-
                avg_over_time(accelerator:token_utilization:ratio{accelerator="gpu-primary"}[4h])
              instant: true
              refId: A
          - &token-threshold
            refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 0.5
              refId: B
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
          ntfy: "true"
        annotations:
          summary: >-
            {{ $labels.accelerator }} token utilization 4-hour average is below 50%
          description: >-
            The 4-hour average accelerator:token_utilization:ratio of {{ $labels.accelerator }} has been below 0.5.
        notification_settings:
          receiver: critical-slack
          group_by:
            - grafana_folder
            - alertname
            - accelerator
          repeat_interval: 4h
      - <<: *critical-alert
        uid: accelerator-underutilized-gpu-secondary
        title: Serving lane gpu-secondary token utilization below 50% over 4 hours
        noDataState: OK
        data:
          - <<: *token-query
            model:
              expr: >-
                avg_over_time(accelerator:token_utilization:ratio{accelerator="gpu-secondary"}[4h])
              instant: true
              refId: A
          - *token-threshold
      - <<: *critical-alert
        uid: accelerator-underutilized-mac-primary
        title: Serving lane mac-primary token utilization below 50% over 4 hours
        noDataState: OK
        data:
          - <<: *token-query
            model:
              expr: >-
                avg_over_time(accelerator:token_utilization:ratio{accelerator="mac-primary"}[4h])
              instant: true
              refId: A
          - *token-threshold
  - orgId: 1
    name: accelerator-token-kpi
    folder: Alerting
    interval: 1m
    rules:
      - <<: *critical-alert
        uid: accelerator-token-kpi-missing
        title: Serving lane token utilization KPI absent for 30 minutes
        data:
          - &serving-query
            refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: victoriametrics
            model:
              # Source: dryvist/prometheus-homelab-rules, rules/accelerator_tokens.yml (PR #11).
              expr: >-
                absent_over_time(accelerator:token_utilization:ratio{accelerator="gpu-primary"}[30m])
                or absent_over_time(accelerator:token_utilization:ratio{accelerator="gpu-secondary"}[30m])
                or absent_over_time(accelerator:token_utilization:ratio{accelerator="mac-primary"}[30m])
              instant: true
              refId: A
          - &positive-result
            refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
              refId: B
        noDataState: OK
        annotations:
          summary: >-
            {{ $labels.accelerator }} token utilization KPI is absent for 30 minutes
          description: >-
            The serving lane has no accelerator:token_utilization:ratio samples in the last 30 minutes.
  - orgId: 1
    name: accelerator-busy-kpi
    folder: Alerting
    interval: 1m
    rules:
      - <<: *critical-alert
        uid: accelerator-busy-kpi-missing
        title: Serving lane busy percent KPI absent for 30 minutes
        data:
          - <<: *serving-query
            datasourceUid: prometheus
            model:
              expr: >-
                absent_over_time(accelerator:busy_percent:avg5m{accelerator="gpu-primary"}[30m])
                or absent_over_time(accelerator:busy_percent:avg5m{accelerator="gpu-secondary"}[30m])
                or absent_over_time(accelerator:busy_percent:avg5m{accelerator="mac-primary"}[30m])
              instant: true
              refId: A
          - *positive-result
        noDataState: OK
        annotations:
          summary: >-
            {{ $labels.accelerator }} busy percent KPI is absent for 30 minutes
          description: >-
            The serving lane has no accelerator:busy_percent:avg5m samples in the last 30 minutes.
  - orgId: 1
    name: router-saturation
    folder: Alerting
    interval: 1m
    rules:
      - <<: *critical-alert
        uid: router-429-rate-high
        title: Router HTTP 429 rate exceeds configured threshold
        data:
          - <<: *serving-query
            model:
              # Source: dashboards/litellm-all-prometheus-metrics.json, proxy traffic.
              expr: >-
                sum(rate(litellm_proxy_total_requests_metric_total{status_code="429"}[5m]))
                or (0 * sum(rate(litellm_proxy_total_requests_metric_total[5m])))
              instant: true
              refId: A
          - <<: *positive-result
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    # Provisioning input: HTTP 429 responses per second (5-minute rate).
                    params:
                      - 1
              refId: B
        noDataState: NoData
        annotations:
          summary: Router HTTP 429 responses exceed the configured rate threshold
          description: >-
            The 5-minute HTTP 429 response rate exceeds the threshold input in data.B.model.conditions[0].evaluator.params[0].
  - orgId: 1
    name: serving-queue
    folder: Alerting
    interval: 1m
    rules:
      - <<: *critical-alert
        uid: serving-queue-waiting-high
        title: Serving lanes have at least 120 waiting requests
        data:
          - <<: *serving-query
            model:
              # Source: dryvist/prometheus-homelab-rules, rules/llm_serving_state.yml.
              expr: >-
                sum(llm:requests_waiting)
              instant: true
              refId: A
          - <<: *positive-result
            model:
              type: math
              expression: $A >= 120
              refId: B
        noDataState: OK
        annotations:
          summary: Total waiting requests across instrumented serving lanes is at least 120
          description: >-
            Total llm:requests_waiting across all serving lanes has reached 120.
      - <<: *critical-alert
        uid: serving-queue-growing
        title: Serving queue arrivals outpace completions over 15 minutes
        data:
          - <<: *serving-query
            model:
              # Sustained positive queue slope tracks net arrivals without a completion counter pair.
              expr: >-
                deriv(sum(llm:requests_waiting)[5m:1m])
              instant: true
              refId: A
          - *positive-result
        for: 15m
        noDataState: OK
        annotations:
          summary: Total serving queue grows for 15 minutes
          description: >-
            The 5-minute slope of total llm:requests_waiting across all serving lanes stays positive for 15 minutes.
