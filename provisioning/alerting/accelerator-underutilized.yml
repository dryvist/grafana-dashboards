# Grafana file-provisioned model-serving alert rules (unified alerting).
# ansible-proxmox-apps copies this file into /var/lib/grafana/provisioning/alerting.
apiVersion: 1
groups:
  - orgId: 1
    name: accelerator-busy
    folder: Alerting
    interval: 1m
    rules:
      - &critical-alert
        uid: accelerator-underutilized
        title: Model-serving busy percent below 50% over 4 hours
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 14400
              to: 0
            datasourceUid: prometheus
            model:
              expr: >-
                avg_over_time(accelerator:busy_percent:avg5m{accelerator=~"gpu-primary|gpu-secondary|mac-primary"}[4h])
              instant: true
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 50
              refId: B
        for: 0s
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
          ntfy: "true"
        annotations:
          summary: >-
            Model-serving busy percent 4-hour average is below 50%
          description: >-
            The 4-hour average busy percent of a model-serving accelerator has been below 50%.
        notification_settings:
          receiver: critical-slack
          group_by:
            - grafana_folder
            - alertname
            - accelerator
          repeat_interval: 4h
  - orgId: 1
    name: accelerator-token-kpi
    folder: Alerting
    interval: 1m
    rules:
      - <<: *critical-alert
        uid: accelerator-token-kpi-missing
        title: Serving lane token utilization KPI absent for 30 minutes
        data:
          - &serving-query
            refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: victoriametrics
            model:
              # Source: dryvist/prometheus-homelab-rules, rules/accelerator_tokens.yml (PR #11).
              expr: >-
                absent_over_time(accelerator:token_utilization:ratio{accelerator="gpu-primary"}[30m])
                or absent_over_time(accelerator:token_utilization:ratio{accelerator="gpu-secondary"}[30m])
                or absent_over_time(accelerator:token_utilization:ratio{accelerator="mac-primary"}[30m])
              instant: true
              refId: A
          - &positive-result
            refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
              refId: B
        noDataState: OK
        annotations:
          summary: >-
            {{ $labels.accelerator }} token utilization KPI is absent for 30 minutes
          description: >-
            The serving lane has no accelerator:token_utilization:ratio samples in the last 30 minutes.
  - orgId: 1
    name: router-saturation
    folder: Alerting
    interval: 1m
    rules:
      - <<: *critical-alert
        uid: router-429-rate-high
        title: Router HTTP 429 rate exceeds configured threshold
        data:
          - <<: *serving-query
            model:
              # Source: dashboards/litellm-all-prometheus-metrics.json, proxy traffic.
              expr: >-
                sum(rate(litellm_proxy_total_requests_metric_total{status_code="429"}[5m]))
              instant: true
              refId: A
          - <<: *positive-result
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    # Provisioning input: HTTP 429 responses per second (5-minute rate).
                    params:
                      - 1
              refId: B
        noDataState: NoData
        annotations:
          summary: Router HTTP 429 responses exceed the configured rate threshold
          description: >-
            The 5-minute HTTP 429 response rate exceeds the threshold input in data.B.model.conditions[0].evaluator.params[0].
