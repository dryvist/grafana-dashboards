# Grafana file-provisioned notification policy (unified alerting). Sends
# severity=critical alerts to the critical-slack contact point every 4h.
# File provisioning replaces the org's whole policy tree, so the root mirrors
# Grafana's built-in defaults (grafana-default-email, default grouping and
# timings) to keep the default route unchanged.
# ansible-proxmox-apps copies this file into /var/lib/grafana/provisioning/alerting.
apiVersion: 1
policies:
  - orgId: 1
    receiver: grafana-default-email
    group_by:
      - grafana_folder
      - alertname
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: critical-slack
        object_matchers:
          - - severity
            - '='
            - critical
        repeat_interval: 4h
