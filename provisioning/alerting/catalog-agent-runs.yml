# Grafana file-provisioned alert rule (unified alerting).
# ansible-proxmox-apps copies this file into /var/lib/grafana/provisioning/alerting.
apiVersion: 1
groups:
  - orgId: 1
    name: catalog-agent-runs
    folder: Alerting
    interval: 1m
    rules:
      - uid: catalog-agent-run-silence
        title: Catalog agents have had no runs in six hours
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: victoriametrics
            model:
              # All catalog agents run through Dify and share the dify
              # api_key_alias; the metrics expose no per-agent run series, so
              # one aggregate covers their shared router path. or vector(0)
              # makes a silent path return 0 instead of no data, which would
              # take the OK noDataState path and never fire.
              expr: >-
                sum(increase(litellm_proxy_total_requests_metric_total{api_key_alias="dify", team!="litellm-internal-health-check"}[6h]))
                or vector(0)
              instant: true
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
              refId: B
        for: 0s
        # A missing export is a telemetry outage, not a silent agent; query
        # errors stay visible through execErrState.
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
          ntfy: "true"
        annotations:
          monitored_agents: >-
            All catalog agents, which run through the shared dify
            api_key_alias; the metrics expose no per-agent run series yet.
          summary: >-
            Catalog agents' shared Dify router path has recorded no requests in six hours
          description: >-
            The catalog agents' shared Dify router path (api_key_alias dify)
            recorded no requests in six hours. See /d/gpu-hardware.
          __dashboardUid__: gpu-hardware
          __panelId__: "31"
        notification_settings:
          receiver: critical-slack
          group_by:
            - grafana_folder
            - alertname
          repeat_interval: 24h
