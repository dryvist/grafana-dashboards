# Grafana file-provisioned alert rule: a CI runner guest with processes stuck in
# uninterruptible wait. A wedged guest piles up blocked tasks while its CPU,
# disk and network sit idle, so load and blocked counts climb with no pressure.
# ansible-proxmox-apps copies this file into /var/lib/grafana/provisioning/alerting.
apiVersion: 1
groups:
  - orgId: 1
    name: runner-guest-blocked
    folder: Alerting
    interval: 1m
    rules:
      - uid: runner-guest-procs-blocked
        title: Runner guest has blocked processes for 15 minutes
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: victoriametrics
            model:
              # The 15-minute minimum ignores the short blocked bursts a busy
              # CI guest has (5 on a healthy runner guest at first read); a
              # wedged guest only climbs, about 50 an hour on 2026-11-17.
              expr: >-
                min_over_time(node_procs_blocked{job="guest_node_exporter", guest=~"docker-host.*"}[15m])
              instant: true
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 20
              refId: B
        for: 15m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
          ntfy: "true"
        annotations:
          __dashboardUid__: homelab-overview
          __panelId__: "20"
          summary: >-
            Runner guest {{ $labels.guest }} has {{ $values.A.Value }} blocked processes.
          description: >-
            Runner guest {{ $labels.guest }} has kept more than 20 processes in
            uninterruptible wait for 15 minutes. A wedged guest keeps its runners offline; restart it
            through guest-recovery.
