# Grafana file-provisioned alert rule (unified alerting).
# The deployment role copies this file into /var/lib/grafana/provisioning/alerting.
apiVersion: 1
groups:
  - orgId: 1
    name: accelerator-ratio-drift
    folder: Alerting
    interval: 1m
    rules:
      - uid: accelerator-ratio-drift
        title: Accelerator KPI ratio exceeds 1.0 for 10 minutes
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              # The recorded accelerator ratio series: slot duty cycle per
              # accelerator, fleet slot utilization, plus the token and VRAM
              # utilization ratios.
              # label_replace stamps each raw series with its kpi name before the
              # range function, which drops __name__ from the labels the summary
              # reads. A ratio above 1.0 means the accelerator:serving_slots
              # constant drifted from the engine's real configuration, so the
              # ratio is never clamped.
              expr: >-
                max_over_time(
                ( label_replace(accelerator:slot_duty_cycle:ratio,
                "kpi", "accelerator:slot_duty_cycle:ratio", "", "")
                or label_replace(accelerator:slot_utilization:ratio,
                "kpi", "accelerator:slot_utilization:ratio", "", "")
                or label_replace(accelerator:token_utilization:ratio,
                "kpi", "accelerator:token_utilization:ratio", "", "")
                or label_replace(accelerator:vram_utilization:ratio,
                "kpi", "accelerator:vram_utilization:ratio", "", "")
                )[10m:1m]
                )
              instant: true
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 1.0
              refId: B
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          ntfy: "true"
        annotations:
          summary: >-
            {{ $labels.kpi }} exceeded 1.0 on
            {{ if $labels.accelerator }}accelerator {{ $labels.accelerator }}{{ else }}the fleet{{ end }}
            for 10 minutes; check accelerator:serving_slots against the
            engine's max_num_seqs or parallel setting
          description: >-
            The 10-minute maximum of {{ $labels.kpi }} stayed above 1.0, so the
            recorded slot-count constant behind the ratio no longer matches the
            engine's real configuration.
        notification_settings:
          receiver: critical-slack
          group_by:
            - grafana_folder
            - alertname
            - accelerator
          repeat_interval: 4h
